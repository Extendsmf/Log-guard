services:
  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    command: /bin/sh -c "rm -f /var/log/nginx/access.log && nginx -g 'daemon off;'"
    volumes:
      - nginx_logs:/var/log/nginx

  logguard:
      build: .
      user: "0:0"   
      depends_on:
        - web
      ports:
        - "8000:8000"
      command: ["--file", "/logs/access.log", "--follow"]
      volumes:
        - nginx_logs:/logs:ro
        - .:/app

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - logguard

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

volumes:
  nginx_logs:
  alerts_data: